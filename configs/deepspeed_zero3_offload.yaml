# ZeRO-3 with CPU optimizer offload - matches MedReason's shipped config.
# Use only on 40GB cards (A100-40G / L40S / A6000) or when GPU memory is tight.
# Expect roughly 1.6-2.2x the wall clock of the no-offload config, and require ~200GB
# of host RAM for the fp32 optimizer state of an 8B model.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: cpu
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
  gradient_clipping: 1.0
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
