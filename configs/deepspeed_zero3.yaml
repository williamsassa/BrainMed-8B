# ZeRO-3, no offload. Default config: 4-8 x 80GB (H100 / A100-80G).
#
# Memory budget for an 8B model on 4 GPUs:
#   bf16 params 16GB/4=4  +  bf16 grads 4  +  fp32 optimizer 96GB/4=24  ~= 32GB + activations.
#
# Differs from MedReason's shipped config in two places:
#   - `use_cpu: true` there is a copy-paste artefact (it asks Accelerate for CPU training);
#   - optimizer offload is dropped, since it is the single biggest slowdown and is
#     unnecessary at >=80GB. Use deepspeed_zero3_offload.yaml on 40GB cards.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
  gradient_clipping: 1.0
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
